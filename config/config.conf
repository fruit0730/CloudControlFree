# 去云控功能开关 — ClassFruit (classfruit.cn)
# 1=开 0=关；开机自动生效，改完点模块 Action 按钮立即重应用
# 本文件在 /data/adb/qyk/config.conf，模块更新不会覆盖

# hosts 域名拦截 (云控配置下发/遥测/统计域名 -> 0.0.0.0)
ENABLE_HOSTS=1

# 禁用纯遥测/云控组件 (名单: pkgs_disable.txt)
ENABLE_DISABLE=1

# iptables 按 UID 断网云控组件 (名单: pkgs_netcut.txt)
# 组件保留但拉不到云控规则，比禁用更不容易出副作用
ENABLE_NETCUT=1

# 开机清理一次云控规则缓存 (名单: pkgs_clean.txt)
# ColorOS 社区验证过的去云控做法；会清掉这些组件的本地数据
ENABLE_CLEAN=1

# 拦截 OTA 云控升级 (域名 + 组件, 名单: pkgs_ota.txt / hosts_ota.txt)
# 关掉后手表/手机可正常自检更新；电脑端 OTA 工具不受影响
ENABLE_OTA=1

# 属性伪装 (props.conf, 默认空; status 日志会列出候选属性)
ENABLE_PROPS=1

# 充电云控: 切断 RUS(romupdate) 下发通道 + 定期采样充电限流节点写 charge.log
ENABLE_CHARGE=1

# 主动回写充电限流节点 (默认关!)
# 限流值也可能由 thermal-engine(高温) / hvdcp_opti(电池老化SOH) 本地压低，
# 那两类是硬件保护，强行顶回去有发热/伤电池风险，所以默认只监视不写。
# 确认是云端压低后再开: CHARGE_FIX=1
CHARGE_FIX=0

# 回写温度闸门(单位 0.1°C): 电池高于此温度时绝不回写, 让路给热保护
CHARGE_SAFE_TEMP=420

# 激进模式: 连推送/应用商店/云同步一起断 (pkgs_aggressive.txt)
# 可能影响通知推送、表盘/应用下载、云同步，默认关闭
ENABLE_AGGRESSIVE=0

# 守护循环间隔(秒): 定期检查 hosts 挂载/iptables/禁用状态并补上
# 手表电池小, 每次唤醒都费电, 默认 1800(半小时); 想更省设 3600, 0=关闭守护
GUARD_INTERVAL=1800

# 日志 (/data/adb/qyk/qyk.log, 超 200KB 自动轮转)
ENABLE_LOG=1

# 暂停整个模块的拦截 (1=开机什么都不做, 模块仍在但不生效)
# 平时不用动它; 想临时放行云控就设 1 并重启, 或直接 sh qyk.sh restore
PAUSE=0