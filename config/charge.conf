# 充电限流节点目标值 — 需 CHARGE_FIX=1 才会写入
# 格式: 节点路径=目标值
#
# 目标值依据: 2026-11-18 在 OWW221 实测"未限流"状态下 (constant_charge_current
# = 1650000 = constant_charge_current_max，即 1.65A 满速) 各节点的读数。
# 内核会自行拒绝越界值，但请不要填超过 _max 的值。
#
# 2026-11-21 完整充电曲线实测 (34%->73%, 10 秒采样):
#   34-45%: 实际 ~630mA, 2.4%/分钟 | 54-60%: ~450mA | 60-65%: ~380mA
#   65% 起电压钉在 4.46V = 进入恒压段, 电流自然衰减到 ~200mA, 70% 后掉速属正常
#   温度 29->31->26.8°C 回落, 不是温控降速; input/charge_control_limit 全程 0
#   chg_limit=1 只在每 1-3 分钟一次的 200mA 电压采样跌落出现(~5-10 秒), 这是本地
#   OCV 采样策略, 顶掉它不会让恒压段变快, 还可能影响电量估算 -> 不建议开 CHARGE_FIX
#
# 写入受温度闸门保护 (config.conf 的 CHARGE_SAFE_TEMP)，
# 高温时 thermal-engine、电池老化时 hvdcp_opti 的本地限流一律不顶。

/sys/class/power_supply/battery/input_current_limit=0
/sys/class/power_supply/battery/chg_limit=0
/sys/class/power_supply/battery/charge_control_limit=0

# 可选: 防止云端直接关掉充电(默认注释, 确认需要再放开)
#/sys/class/power_supply/battery/charging_enabled=1